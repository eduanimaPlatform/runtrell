[package]
name = "runtrell-postgres"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
description = "PostgreSQL durable control store for Runtrell"
include = ["src/**", "migrations/**", "examples/**", "Cargo.toml", "LICENSE", "NOTICE"]

[dependencies]
runtrell = { path = "../runtrell", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "json"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
runtrell-testkit = { path = "../runtrell-testkit", version = "0.1.0" }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
