[package]
name = "runtrell-testkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
description = "Credential-free adapters for runtrell contract tests"

[dependencies]
runtrell = { path = "../runtrell", version = "0.11.4", features = ["test-support"] }
serde_json = "1"
base64 = "0.22.1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "macros"] }

[features]
python = ["runtrell/python"]
