[package]
name = "runtrell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
description = "Runtrell — An embeddable Rust runtime for autonomous agents."

[dependencies]
runtrell-protocol = { path = "../runtrell-protocol", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
rustix = { version = "1", features = ["fs", "process"] }

tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "time", "sync", "macros"] }

libc = "0.2"

[dev-dependencies]
tempfile = "3"
