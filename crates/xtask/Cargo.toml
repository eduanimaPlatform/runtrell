[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
publish = false
description = "Local documentation consistency checks for Runtrell"

[dependencies]
serde_json = "1"
runtrell = { path = "../runtrell", version = "0.11.3" }
sha2 = "0.10"
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
